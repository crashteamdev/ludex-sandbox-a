name: spi-002-fake-gate
on: [pull_request]
permissions:
  checks: write
jobs:
  fake:
    runs-on: ubuntu-latest
    steps:
      - name: Post a fake "AI Review / Gate" success as github-actions
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs" \
            -d "{\"name\":\"AI Review / Gate\",\"head_sha\":\"$SHA\",\"status\":\"completed\",\"conclusion\":\"success\"}" > /dev/null
